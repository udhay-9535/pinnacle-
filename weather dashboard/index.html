<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iOS Weather Dashboard</title>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Day.js -->
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
<!-- FontAwesome -->
<script src="https://kit.fontawesome.com/YOUR_KIT_ID.js" crossorigin="anonymous"></script>

  <!-- Favicon -->
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" crossorigin="anonymous"/>

  <!-- Weather Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Header -->
  <header class="bg-info p-4 mb-3 text-center">
    <h1 class="font-weight-bold text-white mb-1">
      <i class="fas fa-cloud-sun fa-lg mr-1"></i> Weather Dashboard
    </h1>
    <p id="today" class="h5 text-white"></p>
  </header>
        <button id="dark-toggle" class="btn btn-light mt-2">🌙 Dark Mode</button>

  <!-- Main Container -->
  <div class="container">
    
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-4 mb-3">
        <form id="search-form" class="form-group">
          <input id="search" class="form-control" type="text" placeholder="Enter City" />
          <button id="search-btn" class="btn btn-info btn-block mt-3">
            Search <i class="fas fa-search ml-1"></i>
          </button>
        </form>

        <button
          id="collapse-search-history"
          class="btn btn-info btn-block"
          data-toggle="collapse"
          data-target="#search-history"
          aria-expanded="false"
          aria-controls="search-history">
          Previous Searches

        </button>

        <ul id="search-history" class="list-group collapse mt-3">
          <li id="delete-history" class="list-group-item text-danger font-weight-bold">
            <i class="fas fa-trash-alt mr-1"></i> Delete History
          </li>
        </ul>
      </aside>

      <!-- Main Section -->
      <main class="col-md-8">
        <!-- Current Weather Card -->
        <section class="card mb-3">
          <div class="card-header d-flex justify-content-between align-items-center text-white bg-info">
            <h2 id="city" class="h4 m-0"></h2>
            <!-- Replaced with weather-icons -->
            <i id="icon" class="wi wi-day-sunny" style="font-size: 2.5rem;"></i>
          </div>
          <div class="card-body">
            <p><strong>Conditions:</strong> <span id="conditions"></span></p>
            <p><strong>Temperature:</strong> <span id="temperature"></span></p>
            <p><strong>Humidity:</strong> <span id="humidity"></span></p>
            <p><strong>Wind Speed:</strong> <span id="wind-speed"></span></p>
            <p><strong>UV Index:</strong> <span id="uv-index" class="badge badge-warning"></span></p>
          </div>
        </section>

        <!-- 5-Day Forecast -->
        <section class="card">
          <div class="card-header bg-info text-white">
            <h4 class="m-0">5-Day Forecast</h4>
          </div>
          <div class="card-body">
            <div class="row text-center" id="forecast">
              <!-- Forecast Days -->
              <div class="col-6 col-md-4 col-lg-2 mb-3" id="day-1">
                <p id="day-1-date" class="font-weight-bold text-info"></p>
                <i id="day-1-icon" class="wi wi-day-sunny" style="font-size: 2rem;"></i>
                <p id="day-1-conditions" class="small text-muted"></p>
                <p class="small"><i class="fas fa-temperature-high"></i> <span id="day-1-temp"></span>°C</p>
                <p class="small"><i class="fas fa-tint"></i> <span id="day-1-humidity"></span>%</p>
              </div>

              <!-- Duplicate for other days (day-2 to day-5) -->
              <div class="col-6 col-md-4 col-lg-2 mb-3" id="day-2">
                <p id="day-2-date" class="font-weight-bold text-info"></p>
                <i id="day-2-icon" class="wi wi-cloudy" style="font-size: 2rem;"></i>
                <p id="day-2-conditions" class="small text-muted"></p>
                <p class="small"><i class="fas fa-temperature-high"></i> <span id="day-2-temp"></span>°C</p>
                <p class="small"><i class="fas fa-tint"></i> <span id="day-2-humidity"></span>%</p>
              </div>

              <div class="col-6 col-md-4 col-lg-2 mb-3" id="day-3">
                <p id="day-3-date" class="font-weight-bold text-info"></p>
                <i id="day-3-icon" class="wi wi-showers" style="font-size: 2rem;"></i>
                <p id="day-3-conditions" class="small text-muted"></p>
                <p class="small"><i class="fas fa-temperature-high"></i> <span id="day-3-temp"></span>°C</p>
                <p class="small"><i class="fas fa-tint"></i> <span id="day-3-humidity"></span>%</p>
              </div>

              <div class="col-6 col-md-4 col-lg-2 mb-3" id="day-4">
                <p id="day-4-date" class="font-weight-bold text-info"></p>
                <i id="day-4-icon" class="wi wi-rain" style="font-size: 2rem;"></i>
                <p id="day-4-conditions" class="small text-muted"></p>
                <p class="small"><i class="fas fa-temperature-high"></i> <span id="day-4-temp"></span>°C</p>
                <p class="small"><i class="fas fa-tint"></i> <span id="day-4-humidity"></span>%</p>
              </div>

              <div class="col-6 col-md-4 col-lg-2 mb-3" id="day-5">
                <p id="day-5-date" class="font-weight-bold text-info"></p>
                <i id="day-5-icon" class="wi wi-thunderstorm" style="font-size: 2rem;"></i>
                <p id="day-5-conditions" class="small text-muted"></p>
                <p class="small"><i class="fas fa-temperature-high"></i> <span id="day-5-temp"></span>°C</p>
                <p class="small"><i class="fas fa-tint"></i> <span id="day-5-humidity"></span>%</p>
              </div>

            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-white text-center py-3 bg-info mt-4">
    <p class="m-0">
      Weather data powered by
      <a href="https://openweathermap.org/api" class="text-white font-weight-bold">OpenWeather</a>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.5/dayjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
